    { t: 0, body: 'This is the Battle of Prokhorovka in southern Russia on 12 July 1943, the great tank clash of the Kursk campaign. Between the Psel river and the railway the ground narrows to barely 3 kilometres, and Hausser’s SS armoured corps stands directly in the path of a whole Soviet tank army.',
