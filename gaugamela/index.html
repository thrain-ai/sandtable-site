<script>
window.BATTLE = {
  field: { w: 1600, h: 900, kmUnits: 150 },   // ~10.7 km × 6 km of the Gaugamela plain
  scale: 20,                                   // 1 mote = 20 men
  tEnd: 100,
  hook: 'Alexander broke 100,000 Persians at a gallop.',

     dry, near-featureless table — very low noise is the point. The only relief

  terrain: {
    base: 0.07, rise: 0.05, noise: 0.05, floor: 0.02,

      { x: 250,  y: 110, r: 200, h: 0.10 },   // the low hills closing the plain to the north

      { x: 1050, y: 100, r: 200, h: 0.10 },
      { x: 1450, y: 120, r: 180, h: 0.09 },
      { x: 700,  y: 150, r: 70,  h: 0.18 },   // the mound of Tel Gomel — Gaugamela itself
      // Jebel Maqlub and the Zagros front, ~10-15 km NE of the field:
      // off-table at their true bearing, seen when the view pulls back
      { x: 1600, y: -180, r: 260, h: 0.30 },
      { x: 1900, y: -350, r: 380, h: 0.50 },
      { x: 2400, y: -650, r: 500, h: 0.65 },

      { t: 'TO ARBELA →', x: 1540, y: 402, align: 'right' },

    title: { name: 'Gaugamela', sub: '1 October 331 BC', x: 800, y: 210 },

     180=W, 270=N. Macedon (side a) faces north (270); Persia (side b) faces
     south (90). The famous move is Alexander's OBLIQUE drift to his right
     (east), which pulls Bessus's left-wing horse out of line; when a gap
     tears open, the Companions, hypaspists and right phalanx form a wedge
     and drive it at Darius in the centre. Strengths follow Arrian for the
     Macedonians (~47,000) and the sober modern count for the Persians
     (~50–100,000), NOT the ancient million. Deployment and units from
     Arrian 3.11–15. */

    /* ---- Macedon (Alexander), south, facing north ---- */
    /* Alexander and the Companions: the right wing, the wedge, the decider */
    { id: 'comp', side: 'a', n: 100, kind: 'cav', label: 'ALEXANDER · COMPANION CAVALRY',
      kf: [[0,1180,660,270,90,70,0,10],[12,1290,632,278,92,72,0,10],[24,1350,606,285,94,72,0,12],
           [38,1300,556,300,96,74,4,12],[50,1120,470,315,92,88,20,10],[62,950,412,300,88,82,16,10],

      melee: [[24,40,12],[50,66,10]] },
    /* prodromoi, Paeonians, Agrianians and archers: the right flank guard,
       angled back (refused) — it fights Bessus's outflanking ride and shoots
       down the scythed chariots */
    { id: 'rscreen', side: 'a', n: 200, kind: 'cav', label: 'RIGHT FLANK GUARD · AGRIANIANS & ARCHERS',
      kf: [[0,1310,706,315,120,70,0,14],[12,1380,690,320,122,70,0,16],[24,1420,650,330,124,68,0,18],
           [38,1400,590,340,122,66,0,18],[50,1330,545,350,120,64,0,18],[62,1250,520,0,118,62,0,18],
           [88,1150,540,20,116,62,0,20],[100,1100,560,30,114,62,0,20]],
      kill: [[12,0],[24,0.01],[40,0.02],[100,0.03]],
      melee: [[16,50,10]] },
    /* the hypaspists — the hinge between the Companions and the phalanx; they
       follow the wedge in */
    { id: 'hyp', side: 'a', n: 150, kind: 'inf', label: 'HYPASPISTS',
      kf: [[0,1070,650,270,110,80,0,8],[12,1150,636,274,112,80,0,8],[24,1200,618,278,114,80,0,8],
           [38,1160,560,290,116,80,0,8],[50,1030,500,305,118,82,0,8],[62,920,455,300,118,84,0,8],
           [74,860,470,285,116,84,0,8],[100,820,500,280,114,84,0,8]],
      kill: [[38,0],[50,0.004],[100,0.01]],
      melee: [[50,80,7]] },
    /* six phalanx brigades, split into the advancing right and the anchored
       left. The gap in the Macedonian line opens between them — Simmias's
       brigade cannot keep pace with Alexander's advance */
    { id: 'phR', side: 'a', n: 325, kind: 'inf', label: 'PHALANX · COENUS & PERDICCAS',
      kf: [[0,900,652,270,200,90,0,8],[12,960,644,272,200,90,0,8],[24,1000,632,274,200,90,0,8],
           [38,980,585,282,200,92,0,8],[50,900,530,292,200,94,0,8],[62,840,495,288,200,94,0,8],
           [100,815,505,282,200,94,0,8]],
      kill: [[38,0],[50,0.003],[62,0.006],[100,0.008]],
      melee: [[50,100,6]] },
    { id: 'phL', side: 'a', n: 325, kind: 'inf', label: 'PHALANX · SIMMIAS & POLYPERCHON',
      kf: [[0,680,652,270,200,90,0,8],[12,720,646,270,200,90,0,8],[24,745,638,270,200,90,0,8],
           [38,745,622,272,200,92,0,8],[50,720,600,268,205,92,0,8],[62,700,585,266,205,94,0,10],
           [88,700,575,268,205,94,0,8],[100,705,570,270,205,92,0,8]],
      kill: [[24,0],[50,0.006],[62,0.010],[100,0.012]],
      melee: [[38,88,6]] },
    /* Parmenion holds the left: Thessalian horse, hard-pressed by Mazaeus,
       ordered only to keep the line intact until Alexander wins on the right */
    { id: 'thess', side: 'a', n: 100, kind: 'cav', label: 'PARMENION · THESSALIAN CAVALRY',
      kf: [[0,520,660,270,90,60,0,12],[12,500,650,265,92,62,0,12],[24,500,640,260,92,64,0,14],
           [38,505,630,255,94,66,0,16],[50,520,625,250,94,66,0,18],[62,540,615,255,94,64,0,18],
           [74,560,600,260,92,64,0,16],[88,600,585,270,92,62,0,14],[100,660,575,280,90,62,0,12]],
      kill: [[24,0],[38,0.04],[50,0.09],[62,0.13],[74,0.15]],
      melee: [[24,74,12]] },
    { id: 'lscreen', side: 'a', n: 150, kind: 'cav', label: 'LEFT FLANK GUARD · ALLIED & THRACIAN HORSE',
      kf: [[0,490,700,235,110,60,0,14],[12,476,690,230,112,60,0,16],[24,470,675,225,112,62,0,18],
           [38,480,650,230,112,62,0,18],[50,500,632,240,112,60,0,18],[62,528,618,250,110,60,0,18],
           [88,578,596,265,108,60,0,18],[100,620,584,275,106,60,0,16]],
      kill: [[12,0],[24,0.02],[38,0.05],[50,0.08],[74,0.09]],
      melee: [[20,74,11]] },
    /* the second line — a whole rear face of Greek and allied infantry, the
       thing that makes Alexander's army a hollow square. It plugs gaps and,
       when Persian horse burst through to the camp, wheels about and cuts
       them down */
    { id: 'line2', side: 'a', n: 1000, kind: 'inf', label: 'SECOND LINE · THE REAR FACE',
      kf: [[0,800,772,270,520,66,0,8],[24,800,768,270,520,66,0,8],[50,790,762,270,520,68,0,8],
           [62,740,760,280,480,70,0,10],[74,700,758,300,420,74,0,12],[88,720,760,285,460,72,0,10],
           [100,780,764,275,500,70,0,8]],
      kill: [[62,0],[74,0.001],[100,0.002]],
      melee: [[68,90,6]] },

    /* ---- Persia (Darius), north, facing south ---- */
    /* Mazaeus on the Persian right: Median, Syrian and Mesopotamian horse.
       He very nearly turns Parmenion's flank and looses the raid on the camp */
    { id: 'maz', side: 'b', n: 600, kind: 'cav', label: 'MAZAEUS · RIGHT-WING CAVALRY',
      kf: [[0,250,435,90,150,90,0,14],[12,300,470,100,150,88,0,14],[24,360,520,110,150,86,0,16],
           [38,400,570,120,148,84,0,18],[50,440,600,130,146,80,0,20],[62,470,600,140,144,78,0,22],
           [74,430,560,160,142,78,0,22],[88,350,500,180,150,80,0,24],[100,250,440,200,150,80,0,26]],
      kill: [[24,0],[38,0.05],[50,0.10],[62,0.15],[100,0.20]],
      melee: [[24,74,12]] },
    /* the right-centre infantry — the mass of Asiatic levy; it holds while
       the cavalry duel, then breaks when the centre is pierced */
    { id: 'cinfR', side: 'b', n: 1500, kind: 'inf', deathOrder: 'front', label: 'RIGHT-CENTRE INFANTRY',
      kf: [[0,560,410,90,300,120,0,10],[24,590,440,90,300,120,0,10],[50,610,470,90,300,118,0,12],
           [62,620,455,85,300,116,0,14],[74,600,420,80,290,110,0,18],[88,560,370,70,280,105,0,22],
           [100,500,320,65,270,100,0,26]],
      kill: [[50,0],[62,0.10],[74,0.26],[88,0.38],[100,0.42]],
      melee: [[50,88,6]] },
    /* Darius in the centre with the royal kinsmen, the apple-bearer guard and
       his Greek mercenary hoplites — the target of the wedge */
    { id: 'guard', side: 'b', n: 400, kind: 'inf', deathOrder: 'front', label: 'DARIUS · ROYAL GUARD & GREEK MERCENARIES',
      kf: [[0,800,398,90,190,110,0,8],[24,800,415,90,190,110,0,8],[38,800,420,90,190,110,0,8],
           [50,815,430,90,190,110,0,10],[62,850,405,75,180,105,0,16],[74,950,395,50,170,100,0,22],
           [88,1150,380,30,160,95,0,26],[100,1450,365,15,150,90,0,30]],
      kill: [[50,0],[62,0.20],[74,0.40],[88,0.52],[100,0.55]],
      melee: [[50,74,8]] },
    /* the left-centre infantry — Persians, Susians, Cadusians, Indians and
       Mardian archers. Bessus is drawn out to its east; the gap opens here,
       and the wedge tears straight through it */
    { id: 'cinfL', side: 'b', n: 1500, kind: 'inf', deathOrder: 'front', label: 'LEFT-CENTRE INFANTRY',
      kf: [[0,1080,410,90,300,120,0,10],[12,1070,430,90,300,120,0,10],[24,1060,455,90,300,118,0,12],
           [38,1090,470,90,290,116,0,14],[50,1120,455,100,285,112,0,18],[62,1130,415,108,260,108,0,22],
           [74,1140,380,105,240,100,0,24],[88,1160,360,100,210,95,0,28],[100,1190,345,95,190,92,0,32]],
      kill: [[38,0],[50,0.06],[62,0.22],[74,0.36],[88,0.44],[100,0.45]],
      melee: [[44,88,6]] },
    /* Bessus on the Persian left: Bactrian, Dahae and Scythian horse — the
       strongest cavalry on the field. Sent to head off Alexander's oblique,
       he is drawn ever further out, and the gap opens behind him */
    { id: 'bess', side: 'b', n: 600, kind: 'cav', label: 'BESSUS · BACTRIAN & SCYTHIAN HORSE',
      kf: [[0,1350,435,90,150,90,0,14],[12,1400,480,80,150,88,0,16],[24,1440,540,70,148,86,0,18],
           [38,1450,590,60,146,84,0,20],[50,1420,600,50,144,82,0,22],[62,1380,590,40,142,80,0,22],
           [74,1420,540,20,144,80,0,24],[88,1460,470,0,146,80,0,26],[100,1520,410,350,148,80,0,28]],
      kill: [[24,0],[38,0.05],[50,0.10],[62,0.16],[74,0.20],[100,0.22]],
      melee: [[16,74,12]] },
    /* Indian and Persian horse from behind the right-centre: the squadrons
       that burst clean through the gap in the Macedonian left and rode for
       the baggage camp, before the second line caught and destroyed them */
    { id: 'indus', side: 'b', n: 400, kind: 'cav', label: 'INDIAN & PERSIAN HORSE',
      kf: [[0,640,340,90,130,80,0,12],[24,620,420,90,130,80,0,12],[38,600,500,95,128,78,0,14],
           [50,580,600,100,126,74,0,16],[62,600,700,105,120,70,0,20],[74,660,760,120,110,66,0,26],
           [88,700,740,180,108,64,0,30],[100,720,700,200,106,62,0,34]],
      kill: [[38,0],[50,0.03],[62,0.08],[74,0.18],[88,0.30],[100,0.35]],
      melee: [[62,90,10]] },
    /* 200 scythed chariots screening the Persian front. One streak stands for
       several chariots. Loosed at the phalanx, they are shot down by the
       Agrianians and archers and the ranks open to let the rest rattle
       through — the war-winning weapon does almost nothing. score:false keeps
       these (few crew, not "men") out of the 100,000-man muster. */
    { id: 'chariot', side: 'b', n: 30, kind: 'cav', score: false, label: '200 SCYTHED CHARIOTS',
      kf: [[0,800,510,90,700,28,0,10],[12,800,520,90,700,28,0,10],[24,800,590,90,680,26,0,14],
           [38,800,650,90,620,24,0,22],[50,800,660,90,520,24,0,30],[62,800,650,90,420,24,0,34],
           [100,800,645,90,360,24,0,36]],
      kill: [[24,0],[38,0.5],[50,0.8],[100,0.9]],
      melee: [[24,44,8]] },
  ],
  /* projectiles: Agrianian javelins and Cretan archers break the chariots;
     Scythian and Mardian bows harass the wings. One tracer stands for many. */
  volleys: [
    { from: 'phR',     to: 'chariot', t0: 24, t1: 40, rate: 18, kind: 'javelin' },
    { from: 'phL',     to: 'chariot', t0: 24, t1: 40, rate: 18, kind: 'javelin' },
    { from: 'bess',    to: 'rscreen', t0: 14, t1: 44, rate: 9,  kind: 'javelin' },
    { from: 'guard',   to: 'phR',     t0: 44, t1: 58, rate: 11, kind: 'arrow' },
    { from: 'maz',     to: 'thess',   t0: 26, t1: 62, rate: 8,  kind: 'javelin' },
  ],
  phases: [
    { t: 0, body: 'This is the Battle of Gaugamela in what is now northern Iraq on 1 October 331 BC, where Alexander leads 47,000 Macedonians against Darius and the grand army of Persia, perhaps 100,000 strong. Darius has chosen this plain and flattened it so his chariots can run.',
      cite: '— Arrian 3.11–12 · Livius' },
    { t: 12, body: 'Alexander advances at an angle, edging his whole army to the right toward the rough ground at the edge of the levelled plain. To stop him Bessus sends thousands of horsemen sweeping around that flank, which is exactly what Alexander wants him to do.',
      cite: '— Arrian 3.13 · Warry, Warfare in the Classical World' },
    { t: 24, body: 'Darius sends in his 200 scythed chariots, war carts with blades fitted to their wheels, straight at the Macedonian centre. The archers shoot down horses and drivers in the open, and the phalanx calmly opens lanes and lets the survivors rattle through to nothing.',
      cite: '— Arrian 3.13 · Curtius 4.15' },
    { t: 38, body: 'Drawn further and further out to the flank, the Persian left pulls away from its own centre until a gap tears open in the royal line. Directly behind that gap, waiting in a wedge, stand Alexander and the Companion cavalry.',
      cite: '— Arrian 3.14' },
    { t: 50, body: 'Alexander drives the wedge into the gap at a gallop, with the Companions and the Hypaspists and the nearest phalanx battalions striking as one mass. They are aimed not at ground but at a single man, Darius himself, visible in his chariot behind the breaking line.',
      cite: '— Arrian 3.14 · Plutarch, Alexander 33' },
    { t: 62, body: 'As the wedge reaches the royal squadron, Darius turns his chariot and flees the field exactly as he had 2 years before. The Persian centre unravels behind its king, as word of his flight runs down the line faster than any horseman.',
      cite: '— Arrian 3.14 · Diodorus 17.60' },
    { t: 74, body: 'On the far wing the battle is nearly lost the other way, as Mazaeus all but turns Parmenion’s flank and Persian horsemen break through to raid the Macedonian camp. Then the pursuit is recalled, and Alexander swings back across the field to save the left.',
      cite: '— Arrian 3.14–15 · Curtius 4.16' },
    { t: 88, body: 'The Persian army breaks apart and streams toward the town of Arbela, and Darius rides on into the mountains, a fugitive king who will be murdered within the year by his own officers. Ancient writers count Persia’s dead in the tens of thousands against a few hundred Macedonians.',
      cite: '— Arrian 3.15 · Delbrück · World History Enc.' },
  ],
};
</script>
