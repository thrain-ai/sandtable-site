      kf: [[0,820,575,270,640,26,0,10],[10,820,330,270,660,26,0,10],[22,820,470,270,640,28,0,12],

  /* Norman arrows against the shield wall — one tracer stands for many shafts.

  volleys: [
    { from: 'arch', to: 'hcarl', t0: 10, t1: 16, rate: 42, kind: 'arrow' },
    { from: 'arch', to: 'fyrdW', t0: 10, t1: 16, rate: 24, kind: 'arrow' },
    { from: 'hcarl', to: 'ninf', t0: 22, t1: 28, rate: 12, kind: 'javelin' },
    { from: 'arch', to: 'hcarl', t0: 80, t1: 92, rate: 44, kind: 'arrow' },
    { from: 'arch', to: 'fyrdE', t0: 80, t1: 92, rate: 26, kind: 'arrow' },
  ],
  phases: [
    { t: 0, body: 'This is the Battle of Hastings in southern England on 14 October 1066, where William of Normandy has landed to take the English crown and Harold blocks his road inland. Harold packs his army into a dense shield wall along the crest of Senlac ridge.',
      cite: '— English Heritage · Morillo, Hastings: An Unusual Battle' },
    { t: 10, body: 'At about 9 in the morning William sends his archers up the slope first, and they shoot volley after volley into the shields. But shooting uphill does little harm, and with almost no English bowmen to answer them, there are few spent arrows to gather and shoot back.',
      cite: '— English Heritage · Royal Armouries' },
    { t: 22, body: 'Behind the arrows the Norman foot climbs into contact and hacks at the wall, while the housecarls, Harold’s professional guard, answer with two handed war axes that split shield and mail alike. The first assault is thrown back down the hill.',
      cite: '— Royal Armouries · English Heritage' },
    { t: 32, body: 'On the Norman left the Bretons break and stream back down the slope in real panic, and part of the English right chases them off the ridge into the open ground. At the same moment a rumour races through the army that William himself has been killed.',
      cite: '— English Heritage · Morillo' },
    { t: 44, body: 'William pushes back his helmet to show his face and rallies the wavering line. Then he wheels his knights across the slope onto the pursuit caught in the low ground below the wall, and the Englishmen who left the ridge are cut down where they stand.',
      cite: '— English Heritage · Morillo' },
    { t: 58, body: 'Having watched a real flight lure men to their deaths, the Normans now fake retreat on purpose, at least twice turning tail to draw small groups down off the ridge before wheeling back to destroy them. Each trick thins the shield wall a little more.',
      cite: '— Morillo, Hastings: An Unusual Battle' },
    { t: 74, body: 'Through the long afternoon William works his three arms together, sending the archers to shoot high so the arrows fall behind the shields while his foot and horsemen keep pressing. The ridge that has held all day slowly begins to give way at the top.',
      cite: '— English Heritage' },
    { t: 88, body: 'Late in the day Harold is cut down near his standards, and the earliest sources do not agree whether it was the famous arrow in the eye or Norman knights. His leaderless wall dissolves into the woods behind, and within weeks William holds the crown of England.',
      cite: '— English Heritage · Morillo · Marren, 1066' },
  ],
};
