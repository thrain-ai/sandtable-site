    { t: 0, body: 'This is the Battle of Agincourt in northern France on 25 October 1415, where Henry V’s exhausted army of about 6,000 stands across a muddy plowed field between 2 woods. Facing him is a French army perhaps 4 times his size, after a whole night of rain.',
      cite: '— Gesta Henrici Quinti · Curry, Agincourt (2005)' },
    { t: 14, body: 'The French will not attack, so Henry gambles everything and walks his whole line forward to within longbow range. His archers hammer sharpened stakes into the mud in front of them, and then the arrows begin to fall until the French can no longer stand and wait.',
      cite: '— Gesta Henrici Quinti' },
    { t: 26, body: 'The French cavalry charges the archer wedges and discovers what a longbow can do, as 5,000 bows shooting a dozen arrows a minute bring down horses on the soft plowed ground. The survivors stampede back through the front of their own advancing infantry.',

    { t: 40, body: 'Now d’Albret leads 8,000 French knights on foot 300 yards through knee deep mud with heads bowed against the arrow storm, squeezed ever tighter by the woods on either side. When they finally reach Henry’s line they can barely lift their weapons.',
